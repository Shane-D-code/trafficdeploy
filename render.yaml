services:
  - type: web
    name: gridlock-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: |
      npm install --production=false
      npm run build
    startCommand: node dist/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PYTHON_PATH
        value: /usr/bin/python3
      - key: PYTHON_MODULE_PATH
        value: /opt/render/project/src/traffic_violation_project
      - key: DB_PATH
        value: /opt/render/project/src/data/traffic_violations.db
      - key: HF_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health

  - type: web
    name: gridlock-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
    startCommand: npx serve -s dist -l 3000
    envVars:
      - key: VITE_API_URL
        value: https://gridlock-backend.onrender.com/api
