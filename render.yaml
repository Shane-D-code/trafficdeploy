services:
  - type: web
    name: gridlock-backend
    runtime: image
    plan: free
    region: oregon
    image:
      url: node:20-bullseye
      command: |
        apt-get update && apt-get install -y python3 python3-pip
        cd /opt/render/project/src/backend
        npm install --omit=dev
        npm run build
        node dist/app.js
    envVars:
      - key: HF_TOKEN
        sync: false

  - type: web
    name: gridlock-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: |
      npm install
      npm run build
    startCommand: npx serve -s dist -l 3000
